<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Naressh Israni</title>
<meta name="theme-color" content="#111111">
<link rel="stylesheet" href="css/landing.css?v=20260913-admin-theme">
</head>
<body class="admin-page">

<div class="admin-shell">
    <header class="admin-topbar">
        <span class="brand"><span class="brand-mark"><img src="/images/logo.jpg" alt="Naressh Israni Logo" class="brand-logo-img"></span> Naressh Israni <span class="admin-badge"><span data-icon="crown" aria-hidden="true"></span> Admin</span></span>
        <div class="admin-topbar-actions">
            <span id="adminWhoami" class="text-muted text-sm text-bold"></span>
            <a href="/app" class="btn btn-ghost"><span data-icon="layout-dashboard" aria-hidden="true"></span> My Dashboard</a>
            <button class="btn btn-ghost" id="logoutBtn"><span data-icon="log-out" aria-hidden="true"></span> Log Out</button>
        </div>
    </header>

    <main class="admin-main">
        <div class="admin-stats-grid" id="platformStats">
            <!-- filled by admin.js -->
        </div>

        <div class="admin-panel">
            <div class="admin-panel-head">
                <h2><span data-icon="users" aria-hidden="true"></span> All Accounts</h2>
                <div class="admin-search">
                    <span data-icon="search" aria-hidden="true"></span>
                    <input type="search" id="userSearch" placeholder="Search by business or email…">
                </div>
            </div>
            <div class="table-responsive">
                <table class="admin-table" id="usersTable">
                    <thead>
                        <tr>
                            <th>Account</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>WA Access</th>
                            <th>WhatsApp</th>
                            <th>Usage</th>
                            <th>Plan / Limits</th>
                            <th>Joined</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="usersBody"></tbody>
                </table>
            </div>
            <div class="admin-empty hidden" id="usersEmpty">
                <span data-icon="users" aria-hidden="true"></span>
                <div>No accounts match your search.</div>
            </div>
        </div>
    </main>
</div>

<!-- Edit account modal -->
<div class="modal-backdrop" id="editModalBackdrop">
    <div class="modal-box">
        <h3><span data-icon="settings" class="icon-inline" aria-hidden="true"></span>Edit Account</h3>
        <input type="hidden" id="editUserId">
        <div class="form-field">
            <label>Business Name</label>
            <input type="text" id="editBusinessName">
        </div>
        <div class="form-field">
            <label>Owner Name</label>
            <input type="text" id="editOwnerName">
        </div>
        <div class="form-field">
            <label>Role</label>
            <select id="editRole">
                <option value="user">User</option>
                <option value="admin">Admin</option>
            </select>
        </div>
        <div class="form-field">
            <label>Plan</label>
            <input type="text" id="editPlan" placeholder="free">
        </div>
        <div class="form-field">
            <label>Monthly Message Limit <small class="text-secondary text-regular">(0 = unlimited)</small></label>
            <input type="number" id="editMessageLimit" min="0" step="1">
        </div>
        <div class="form-field">
            <label>Chatbot Rule Limit <small class="text-secondary text-regular">(0 = unlimited)</small></label>
            <input type="number" id="editRuleLimit" min="0" step="1">
        </div>
        <div class="modal-actions">
            <button class="btn btn-tiny" id="editCancelBtn" type="button">Cancel</button>
            <button class="btn btn-primary" id="editSaveBtn" type="button"><span data-icon="save" class="icon-inline" aria-hidden="true"></span>Save Changes</button>
        </div>
    </div>
</div>

<div class="toast-host" id="toastHost"></div>

<script src="js/icons.js?v=20261028_4"></script>
<script src="js/admin.js?v=20261028_4"></script>
</body>
</html>
